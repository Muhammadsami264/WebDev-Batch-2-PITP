            <section class="container">

                    <input type="text" required placeholder="Second Name" id="name">

                    <br><br>

                    <br><br>
                    <label for="postal">Postal Code:</label>

                    <br><br>
                    <label for="email">Email:</label>
                    <input required type="email" placeholder="xyz@gmailcom" id="email">
                    <br><br><br>
                    <label for="parent">Parent/Guardian Name:</label>

                    <br><br>
